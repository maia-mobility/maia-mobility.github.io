# GitHub Pages 배포.
#
# 쓰기 전에 할 일:
#   1. 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꾼다
#   2. 저장소 Settings → Secrets and variables → Actions → Variables 에
#      **SITE_URL** 을 넣는다. canonical·OG·sitemap·hreflang 이 전부 이 값을 쓴다.
#      - 계정 페이지:     https://<계정>.github.io
#      - 프로젝트 저장소: https://<계정>.github.io/<저장소>
#   3. **프로젝트 저장소라면 BASE_PATH 변수도 넣는다** (예: /maia-lab).
#      사이트가 도메인 루트가 아니라 하위 경로에 놓이므로, 이 값이 없으면 링크와
#      이미지가 전부 사이트 밖(/people, /images/...)을 가리켜 404 가 된다.
#      계정 페이지·커스텀 도메인이면 비워 둔다.
#   4. 학교 도메인을 쓴다면 SITE_URL 만 바꾸고 public/CNAME 파일을 추가한다
#      (이때 BASE_PATH 는 비운다 — 도메인 루트에 놓이므로)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 워크플로 전체 기본값은 **읽기만**. 필요한 권한은 각 작업이 스스로 선언한다.
permissions:
  contents: read

# 액션은 **커밋 SHA 로 고정한다.**
# `@v7` 같은 태그는 그 저장소 관리자가 언제든 다른 커밋으로 옮길 수 있다. 태그를
# 참조하면 남이 옮긴 코드가 우리 빌드에서 그대로 실행된다 — 실제로 이 경로로 털린
# 사례가 여럿 있다. SHA 는 옮길 수 없다.
# 버전 갱신은 Dependabot 이 PR 로 올린다(.github/dependabot.yml).

# 배포는 한 번에 하나만. 진행 중인 것을 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 빌드는 소스를 읽기만 한다.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Secret scan
        run: npm run lint:secrets

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://example.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages 배포에만 필요한 권한. 소스 쓰기 권한은 어느 작업에도 없다.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
