# GitHub Pages 배포.
#
# 쓰기 전에 할 일:
#   1. 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꾼다
#   2. 저장소 Settings → Secrets and variables → Actions → Variables 에
#      **SITE_URL** 을 넣는다. canonical·OG·sitemap·hreflang 이 전부 이 값을 쓴다.
#      - 계정 페이지:     https://<계정>.github.io
#      - 프로젝트 저장소: https://<계정>.github.io/<저장소>
#   3. **프로젝트 저장소라면 BASE_PATH 변수도 넣는다** (예: /maia-lab).
#      사이트가 도메인 루트가 아니라 하위 경로에 놓이므로, 이 값이 없으면 링크와
#      이미지가 전부 사이트 밖(/people, /images/...)을 가리켜 404 가 된다.
#      계정 페이지·커스텀 도메인이면 비워 둔다.
#   4. 학교 도메인을 쓴다면 SITE_URL 만 바꾸고 public/CNAME 파일을 추가한다
#      (이때 BASE_PATH 는 비운다 — 도메인 루트에 놓이므로)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 것을 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://example.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
