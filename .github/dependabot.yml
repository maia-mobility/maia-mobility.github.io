# 액션 버전만, 분기에 한 번.
#
# 이 저장소는 **연구실 홈페이지 하나를 올려 두는 곳**이다. 개발팀이 붙어 있지 않고
# 평소에는 아무도 보지 않는다. 그런 저장소에 매달 갱신 PR 이 쌓이면 그건 보안이
# 아니라 소음이고, 소음이 쌓이면 정작 중요한 PR 도 같이 묻힌다.
#
# 그래서 두 가지를 나눴다:
#
#   · **실제 취약점** → GitHub 의 Dependabot security updates 가 그때그때 PR 을
#     올린다(저장소 설정에서 켜 두었다). 이건 드물게 오고, 올 때는 봐야 한다.
#   · **일반 버전 갱신** → npm 쪽은 끈다. 정적 사이트라 빌드 의존성이 방문자에게
#     도달하지 않으므로, 취약점이 아닌 갱신을 서두를 이유가 없다.
#
# 액션만 남긴 이유: deploy.yml 이 액션을 **커밋 SHA 로 고정**하고 있어 사람이
# 직접 올리기 어렵다. 고정만 하고 갱신을 안 하면 몇 년 뒤 러너가 지원을 끊으면서
# 배포가 멈춘다(실제로 Node 20 지원 중단 경고를 이미 한 번 맞았다).
# 분기 1회면 그 일을 미리 알아채기에 충분하다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # 액션은 1년에 몇 번 안 바뀐다 — 그루핑해서 PR 하나로 받는다.
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'ci'
